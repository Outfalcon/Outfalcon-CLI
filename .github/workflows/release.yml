name: Release

# Publishes @outfalcon/falcon. Three ways in:
#   • daily schedule / manual dispatch → regenerate the route registry from the PUBLIC OpenAPI spec;
#     if it changed, bump the patch version and publish. (Dispatch can force-publish current version.)
#   • push a tag v*.*.* → publish the current version (manual/code-only releases).
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN secret. Long-lived publish
# tokens died 2026-07-08 (bypass-2FA GAT deprecation; every token publish 403'd from that day).
# One-time npm-side setup: npmjs.com → @outfalcon/falcon → Settings → Trusted Publisher →
# GitHub Actions → owner "Outfalcon", repo "Outfalcon-CLI", workflow "release.yml".
# Requires npm CLI >= 11.5.1 and `id-token: write` below; runs on GitHub-hosted runners only.
# No repo/backend access needed — the registry is reconstructed from the public
# GET /api/v1/openapi.json.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current version even if the registry is unchanged"
        type: boolean
        default: false
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # push the version-bump commit + tag
  id-token: write # mint the OIDC token npm trusted publishing exchanges for publish rights

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 20 bundles npm 10.x; trusted publishing needs the OIDC-aware npm CLI (>= 11.5.1).
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Sync registry from public spec
        id: sync
        if: github.event_name != 'push'
        run: |
          node scripts/sync-registry.mjs
          if git diff --quiet -- src/vendor/openapi.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Registry unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Registry changed — will release."
          fi

      - name: Build & test
        run: |
          npm run build
          npm test

      - name: Bump version & push (registry changed)
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "outfalcon-bot"
          git config user.email "bot@outfalcon.dev"
          git add src/vendor/openapi.ts
          git commit -m "chore: sync route registry from public spec"
          npm version patch -m "release: v%s"
          git push --follow-tags origin HEAD:main

      # npm can fall behind the repo version when a publish fails (the 2026-07/08 stretch where
      # a token without 2FA-bypass 403'd every publish while the version kept bumping). Publishing
      # whenever npm's latest != package.json makes the next healthy run catch up, and keeps the
      # scheduled run loudly red while npm is stale instead of "success" on no-change days.
      - name: Check npm is current
        id: npmver
        if: github.event_name != 'push'
        run: |
          published=$(npm view @outfalcon/falcon version 2>/dev/null || echo "0.0.0")
          local=$(node -p "require('./package.json').version")
          echo "published=$published local=$local"
          echo "behind=$([ "$published" != "$local" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # No token: npm >= 11.5.1 detects the trusted-publisher OIDC exchange automatically
      # (and attaches provenance). Fails with an auth error until the one-time npm-side
      # Trusted Publisher config exists for this repo+workflow.
      - name: Publish to npm
        if: >-
          github.event_name == 'push' ||
          steps.sync.outputs.changed == 'true' ||
          steps.npmver.outputs.behind == 'true' ||
          inputs.force_publish
        run: npm publish --access public
